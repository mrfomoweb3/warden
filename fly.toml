# Fly.io: one always-on machine running the whole stack (see scripts/start-all.mjs).
# Keep exactly one machine: two Wardens would act twice on the vault and fight over the Telegram bot.
app = "usewarden"
primary_region = "fra"

[env]
  SUI_NETWORK = "testnet"
  PAID_API_URL = "http://localhost:4021"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
